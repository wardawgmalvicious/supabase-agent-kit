# The baseline the audit-repo skill scaffolds: the hooks that keep a secret
# or a denylisted name out of a push, so the repo never needs the
# delete-and-recreate that recreate-repo walks through.
#
# Three git hooks, not one: identity-guard gates the commit, its message
# and the push. pre-commit installs only the types named here, writing no
# hook for a stage it does not list and saying nothing, so every stage the
# hooks use is named. default_stages keeps any hook without a stages: key on
# pre-commit alone.
default_install_hook_types: [pre-commit, commit-msg, pre-push]
default_stages: [pre-commit]

repos:
  # rev: is a full commit SHA, since a tag can be moved, in the `# frozen:`
  # form autoupdate writes. Do not run `pre-commit autoupdate --freeze` on
  # it: that took v8.30.0 for the newest tag, v8.30.1 being off gitleaks'
  # default branch, and stored the tag object's SHA, not a commit
  # (2026-10-27). To re-pin, take the `^{}` line of `git ls-remote --tags
  # <repo> '<tag>' '<tag>^{}'` when there is one, else the plain line.
  - repo: https://github.com/gitleaks/gitleaks
    rev: 83d9cd684c87d95d656c1458ef04895a7f1cbd8e  # frozen: v8.30.1
    hooks:
      - id: gitleaks
        name: Scan staged changes for secrets (gitleaks)

  # identity-guard is the user's Claude Code hook, deployed at
  # ~/.claude/hooks/, scanning against ~/.config/identity-denylist.txt,
  # which is in no repo. As a git hook it gates commits whoever makes them,
  # a terminal's or another tool's included, which its Claude Code side never
  # sees. A clone without the script, a co-developer's, skips it rather
  # than failing every commit. bash under a git hook is Git's, not WSL's;
  # a hand run from PowerShell finds WSL's first, so put Git's usr\bin
  # ahead of PATH for it, as pre-commit-bootstrap.ps1 -RunAll does, or run
  # it from Git Bash.
  - repo: local
    hooks:
      - id: identity-guard
        name: Scan staged additions for denylisted identity strings
        entry: bash -c 'f="$HOME/.claude/hooks/identity-guard.sh"; [ -f "$f" ] || exit 0; exec bash "$f" --git-hook pre-commit' identity-guard
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]
      - id: identity-guard-message
        name: Scan the commit message for denylisted identity strings
        entry: bash -c 'f="$HOME/.claude/hooks/identity-guard.sh"; [ -f "$f" ] || exit 0; exec bash "$f" --git-hook commit-msg "$@"' identity-guard
        language: system
        always_run: true
        stages: [commit-msg]
      - id: identity-guard-push
        name: Scan unpushed commits for denylisted identity strings
        entry: bash -c 'f="$HOME/.claude/hooks/identity-guard.sh"; [ -f "$f" ] || exit 0; exec bash "$f" --git-hook pre-push' identity-guard
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]

  # The script's lint and format check, as CLAUDE.md's Commands run them, and
  # the check that its three descriptions agree. shellcheck and shfmt come from
  # PATH: a clone without one skips it with a line rather than failing every
  # commit. verbose: true shows that line, since pre-commit hides a passing
  # hook's output and the skip would read as Passed; it also prints each run's
  # hook id and duration. docs-in-step lists its own script in files:,
  # since a hook whose script sits outside its pattern skips when only the
  # script changes.
  - repo: local
    hooks:
      - id: shellcheck
        name: Lint shell scripts (shellcheck)
        entry: bash -c 'command -v shellcheck > /dev/null || { echo "shellcheck skipped, not on PATH"; exit 0; }; exec shellcheck "$@"' shellcheck
        language: system
        files: \.sh$
        verbose: true
      - id: shfmt
        name: Check shell script formatting (shfmt -i 4 -ci)
        entry: bash -c 'command -v shfmt > /dev/null || { echo "shfmt skipped, not on PATH"; exit 0; }; exec shfmt -d -i 4 -ci "$@"' shfmt
        language: system
        files: \.sh$
        verbose: true
      - id: docs-in-step
        name: Check the script header, README and SKILL.md agree
        entry: bash scripts/dev/check-docs-in-step.sh
        language: system
        pass_filenames: false
        files: ^(scripts/db/supabase-query\.sh|README\.md|\.claude/skills/query-supabase/SKILL\.md|scripts/dev/check-docs-in-step\.sh)$

# The handoff queue's check, appended under `repos:` in the repo's
# .pre-commit-config.yaml once a docs/handoffs/ exists. It runs the
# triage-inbox skill's handoff-status.py, so no repo names the repo the
# skill comes from. always_run, since pre-commit passes no deleted file,
# and a landing whose only brief change is the deletion is the commit that
# strands a blocked-by. --no-inbox, or every other repo's inbox directory
# reads as an orphan. A clone without the skill or uv, a co-developer's,
# skips it with a line rather than failing every commit. The entry holds no
# colon followed by a space, which YAML reads as a key in a plain scalar
# and pre-commit then refuses the whole file.
  - repo: local
    hooks:
      - id: lint-briefs
        name: Check each handoff brief's frontmatter and blockers
        entry: bash -c 'f="$HOME/.claude/skills/triage-inbox/scripts/handoff-status.py"; if [ ! -f "$f" ] || ! command -v uv > /dev/null; then echo "lint-briefs skipped, no uv or no triage-inbox skill at $f"; exit 0; fi; exec uv run --no-project --quiet "$f" . --check --no-inbox' lint-briefs
        language: system
        pass_filenames: false
        always_run: true
